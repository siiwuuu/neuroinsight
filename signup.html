<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - NeuroInsight</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* --- 홈 화면과 100% 동기화된 글로벌 디자인 시스템 --- */
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; 
            background-color: #ffffff; 
            color: #0f172a; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            letter-spacing: -0.2px;
        }
        
        /* --- 상단 네비게이션 바 (글래스모피즘 스타일) --- */
        .navbar { 
            background-color: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 60px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-left { display: flex; align-items: center; }
        .nav-right { display: flex; align-items: center; gap: 8px; }
        
        .logo {
            font-size: 16px;
            font-weight: 800;
            color: #070b19;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .navbar a:not(.logo) { 
            color: #475569; 
            text-decoration: none; 
            font-size: 13px; 
            font-weight: 600; 
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .navbar a:not(.logo):hover {
            color: #2563eb;
            background-color: #f1f5f9;
        }

        /* --- 회원가입 섹션 컨테이너 (은은한 그리드 배경) --- */
        .auth-wrapper { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 60px 20px; 
            background-image: linear-gradient(#f8fafc 1px, transparent 1px), linear-gradient(90deg, #f8fafc 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* --- 회원가입 카드 디자인 --- */
        .auth-container { 
            background: #ffffff; 
            padding: 50px 40px; 
            border-radius: 12px; 
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
        }
        .auth-container h2 { 
            font-size: 26px; 
            font-weight: 800;
            margin: 0 0 10px 0; 
            color: #020617; 
            letter-spacing: -0.5px;
        }
        .auth-container p { 
            color: #64748b; 
            font-size: 14px; 
            margin-bottom: 35px; 
            font-weight: 400;
        }

        /* --- 입력창 그룹 스타일 --- */
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { 
            display: block; 
            font-size: 11px; 
            font-weight: 700; 
            text-transform: uppercase; 
            margin-bottom: 8px; 
            color: #475569; 
            letter-spacing: 0.5px;
        }
        .form-group input { 
            width: 100%; 
            padding: 12px 16px; 
            border: 1px solid #e2e8f0; 
            border-radius: 6px; 
            font-family: inherit; 
            font-size: 14px;
            color: #0f172a;
            box-sizing: border-box; 
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* --- 제출 버튼 --- */
        .btn-submit { 
            width: 100%; 
            padding: 14px; 
            background-color: #2563eb; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 14px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: background-color 0.2s ease;
        }
        .btn-submit:hover { 
            background-color: #1d4ed8; 
        }

        /* --- 하단 링크 영역 --- */
        .auth-footer { margin-top: 30px; font-size: 13px; color: #94a3b8; }
        .auth-footer a { color: #2563eb; text-decoration: none; font-weight: 600; transition: color 0.2s ease; }
        .auth-footer a:hover { text-decoration: underline; color: #1d4ed8; }

        /* 모바일 반응형 대응 */
        @media (max-width: 900px) {
            .navbar { padding: 16px 24px; flex-direction: column; gap: 16px; }
            .nav-right { flex-wrap: wrap; justify-content: center; gap: 4px; }
            .auth-container { padding: 40px 24px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo">NeuroInsight</a>
        </div>
        <div class="nav-right">
            <a href="index.html">Home</a>
            <a href="brain.html">Brain Map</a>
            <a href="archive.html">Brain Archive</a> 
            <a href="disease.html">Disorder</a>
            <a href="bbb.html">BBB</a>
            <a href="treatment.html">Treatment</a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-container">
            <h2>Join Us</h2>
            <p>Create an account to access advanced therapeutics research.</p>

            <form id="signupForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="researcher@neuro.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Min. 6 characters" required>
                </div>
                
                <button type="submit" class="btn-submit">Sign Up</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Log in here</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA8UUSVJ9gX0JdC04ke6FpEV5yix9FR3Is",
            authDomain: "neuroinsight-9a401.firebaseapp.com",
            projectId: "neuroinsight-9a401",
            storageBucket: "neuroinsight-9a401.firebasestorage.app",
            messagingSenderId: "273812619662",
            appId: "1:273812619662:web:1427bcc820350c97ca24df",
            measurementId: "G-L8F2G12TM9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById("signupForm").addEventListener("submit", (e) => {
            e.preventDefault();
            
            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    // 회원가입 시 입력받은 이름으로 프로필 업데이트
                    return updateProfile(user, {
                        displayName: name
                    }).then(() => {
                        alert("회원가입이 완료되었습니다! 메인 페이지로 이동합니다.");
                        window.location.href = "index.html"; 
                    });
                })
                .catch((error) => {
                    const errorCode = error.code;
                    const errorMessage = error.message;
                    
                    if(errorCode === 'auth/email-already-in-use') {
                        alert("이미 사용 중인 이메일입니다.");
                    } else if (errorCode === 'auth/weak-password') {
                        alert("비밀번호는 6자리 이상이어야 합니다.");
                    } else {
                        alert("회원가입 오류: " + errorMessage);
                    }
                });
        });
    </script>
</body>
</html>
