<form id="signupForm">
    <div class="input-group">
        <label>User Name (ID)</label>
        <input type="text" id="username" placeholder="사이트에서 사용할 이름" required>
    </div>
    <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" required>
    </div>
    </form>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

    const firebaseConfig = { /* 사용자님의 Config 입력 */ };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            // 1. 계정 생성
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            // 2. 사용자 프로필에 이름(아이디) 저장
            await updateProfile(userCredential.user, { displayName: username });
            
            alert(`${username}님, 환영합니다!`);
            window.location.href = "index.html";
        } catch (error) {
            alert("에러 발생: " + error.message);
        }
    });
</script>
