<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - NeuroInsight</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Libre Baskerville', serif; margin: 0; background-color: #f8fafc; color: #1e293b; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* 네비게이션 바 - 로그인 페이지와 동일한 네이비톤 유지 */
        .navbar { background-color: #0f172a; padding: 25px 60px; display: flex; justify-content: flex-end; align-items: center; }
        .navbar a { color: rgba(255, 255, 255, 0.8); text-decoration: none; margin-left: 30px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; transition: 0.3s; }
        .navbar a:hover { color: #fff; }

        /* 회원가입 카드 */
        .auth-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 60px 20px; }
        .auth-card { background: white; padding: 45px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); width: 100%; max-width: 450px; text-align: center; }
        .auth-card h2 { font-size: 28px; margin-bottom: 10px; color: #0f172a; }
        .auth-card p { color: #64748b; font-size: 14px; margin-bottom: 30px; }

        .input-group { text-align: left; margin-bottom: 18px; }
        .input-group label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; color: #475569; letter-spacing: 1px; }
        .input-group input { width: 100%; padding: 12px 16px; border: 1px solid #e2e8f0; border-radius: 8px; font-family: inherit; box-sizing: border-box; transition: 0.3s; }
        .input-group input:focus { outline: none; border-color: #0f172a; }

        .auth-btn { width: 100%; padding: 14px; background-color: #0f172a; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .auth-btn:hover { background-color: #1e293b; }

        .footer-links { margin-top: 25px; font-size: 13px; color: #64748b; }
        /* 하단 링크 강조 */
        .footer-links a { color: #0f172a; text-decoration: none; font-weight: 700; margin-left: 5px; }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="brain.html">Brain Map</a>
        <a href="archive.html">Brain Archive</a>
        <a href="disease.html">Disorder</a>
        <a href="bbb.html">BBB</a>
        <a href="treatment.html">Treatment</a>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Create Account</h2>
            <p>Join the NeuroInsight Research Community</p>
            
            <form id="signupForm">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Your Name" required>
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@example.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Min. 8 characters" required>
                </div>
                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Repeat your password" required>
                </div>
                <button type="submit" class="auth-btn">Register</button>
            </form>

            <div class="footer-links">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>

</body>
</html>
