<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroInsight - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Libre Baskerville', serif; margin: 0; background-color: #f8fafc; color: #1e293b; }
        
        /* 네비게이션 바 디자인 */
        .navbar { 
            background-color: #0f172a; 
            padding: 15px 60px; 
            display: flex; 
            justify-content: space-between; /* 양 끝 정렬 */
            align-items: center; 
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* 왼쪽 프로필 영역 */
        .user-profile {
            display: none; /* 로그인 전에는 숨김 */
            align-items: center;
            gap: 12px;
        }
        .user-profile img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #60a5fa;
        }
        .user-profile span {
            color: white;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* 오른쪽 메뉴 링크 */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .nav-links a { 
            color: rgba(255, 255, 255, 0.7); 
            text-decoration: none; 
            font-size: 13px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            transition: 0.3s;
        }
        .nav-links a:hover { color: #fff; }
        
        /* 특별 강조되는 Login/Logout 버튼 */
        .login-btn {
            color: #60a5fa !important;
            border: 1px solid #60a5fa;
            padding: 8px 18px;
            border-radius: 20px;
        }
        .login-btn:hover {
            background-color: #60a5fa;
            color: #0f172a !important;
        }

        /* 메인 컨텐츠 대략적인 스타일 */
        .hero { padding: 100px 60px; text-align: center; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="user-profile" id="userProfile">
            <img id="userPhoto" src="" alt="Profile">
            <span id="userNameDisplay"></span>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="brain.html">Brain Map</a>
            <a href="archive.html">Archive</a>
            <a href="login.html" class="login-btn" id="authBtn">Login</a>
        </div>
    </nav>

    <header class="hero">
        <h1>NeuroInsight</h1>
        <p>Exploring the depths of the human mind.</p>
    </header>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

        // 사용자의 Firebase 설정값 (그대로 붙여넣으세요)
        const firebaseConfig = {
            apiKey: "AIzaSyA8UUSVJ9gX0JdC04ke6FpEV5yix9FR3Is",
            authDomain: "neuroinsight-9a401.firebaseapp.com",
            projectId: "neuroinsight-9a401",
            storageBucket: "neuroinsight-9a401.firebasestorage.app",
            messagingSenderId: "273812619662",
            appId: "1:273812619662:web:1427bcc820350c97ca24df",
            measurementId: "G-L8F2G12TM9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // 로그인 상태 실시간 감시
        onAuthStateChanged(auth, (user) => {
            const userProfile = document.getElementById('userProfile');
            const userPhoto = document.getElementById('userPhoto');
            const userNameDisplay = document.getElementById('userNameDisplay');
            const authBtn = document.getElementById('authBtn');

            if (user) {
                // 1. 로그인 되었을 때
                userProfile.style.display = "flex"; // 프로필 보이기
                userNameDisplay.textContent = user.displayName || "User";
                userPhoto.src = user.photoURL || "https://cdn-icons-png.flaticon.com/512/149/149071.png";

                authBtn.textContent = "Logout";
                authBtn.href = "#";
                authBtn.onclick = (e) => {
                    e.preventDefault();
                    signOut(auth).then(() => {
                        alert("로그아웃 되었습니다.");
                        location.reload();
                    });
                };
            } else {
                // 2. 로그아웃 상태일 때
                userProfile.style.display = "none"; // 프로필 숨김
                authBtn.textContent = "Login";
                authBtn.href = "login.html";
                authBtn.onclick = null;
            }
        });
    </script>
</body>
</html>
