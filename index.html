<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroInsight - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Libre Baskerville', serif; margin: 0; background-color: #f8fafc; color: #1e293b; }
        
        /* 네비게이션 바: 기존 스타일 유지 + 프로필 공간 확보 */
        .navbar { 
            background-color: #000b1a; 
            padding: 20px 60px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* 왼쪽: 로그인 시 나타나는 프로필 영역 */
        .user-profile {
            display: none; /* 로그인 전에는 숨김 */
            align-items: center;
            gap: 12px;
        }
        .user-profile img {
            width: 35px; 
            height: 35px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 1.5px solid rgba(255,255,255,0.5);
        }
        .user-profile span {
            color: white;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* 오른쪽: 원래 있던 메뉴들 */
        .nav-links { display: flex; align-items: center; }
        .nav-links a { 
            color: rgba(255, 255, 255, 0.7); 
            text-decoration: none; 
            margin-left: 25px; 
            font-size: 12px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            transition: 0.3s;
        }
        .nav-links a:hover { color: #fff; }

        /* 로그인/로그아웃 버튼 스타일 */
        #authBtn {
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 6px 15px;
            border-radius: 4px;
        }

        /* 메인 컨텐츠 영역 (기존 디자인 유지) */
        .hero { padding: 120px 60px; text-align: center; }
        .hero h1 { font-size: 48px; color: #000b1a; margin-bottom: 20px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="user-profile" id="userProfile">
            <img id="userPhoto" src="" alt="Profile">
            <span id="userNameDisplay"></span>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="brain.html">Brain Map</a>
            <a href="archive.html">Brain Archive</a>
            <a href="disease.html">Disorder</a>
            <a href="bbb.html">BBB</a>
            <a href="treatment.html">Treatment</a>
            <a href="login.html" id="authBtn">Login</a>
        </div>
    </nav>

    <header class="hero">
        <h1>NeuroInsight</h1>
        <p>Exploring the complex landscapes of neuroscience.</p>
    </header>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

        // 사용자님의 실제 Config (꼭 다시 확인!)
        const firebaseConfig = {
            apiKey: "AIzaSyA8UUSVJ9gX0JdC04ke6FpEV5yix9FR3Is",
            authDomain: "neuroinsight-9a401.firebaseapp.com",
            projectId: "neuroinsight-9a401",
            storageBucket: "neuroinsight-9a401.firebasestorage.app",
            messagingSenderId: "273812619662",
            appId: "1:273812619662:web:1427bcc820350c97ca24df",
            measurementId: "G-L8F2G12TM9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            const userProfile = document.getElementById('userProfile');
            const userPhoto = document.getElementById('userPhoto');
            const userNameDisplay = document.getElementById('userNameDisplay');
            const authBtn = document.getElementById('authBtn');

            if (user) {
                // 로그인 상태
                userProfile.style.display = "flex";
                userNameDisplay.textContent = user.displayName || "Researcher";
                userPhoto.src = user.photoURL || "https://cdn-icons-png.flaticon.com/512/149/149071.png";

                authBtn.textContent = "Logout";
                authBtn.href = "#";
                authBtn.onclick = (e) => {
                    e.preventDefault();
                    signOut(auth).then(() => {
                        alert("로그아웃 되었습니다.");
                        location.reload();
                    });
                };
            } else {
                // 로그아웃 상태
                userProfile.style.display = "none";
                authBtn.textContent = "Login";
                authBtn.href = "login.html";
                authBtn.onclick = null;
            }
        });
    </script>
</body>
</html>
