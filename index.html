<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro Insight - Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        /* --- 홈화면(index.html) 톤앤매너 완벽 동기화 --- */
        body {
            font-family: 'Libre Baskerville', serif;
            margin: 0;
            background-color: #0f172a; /* 홈화면 헤더와 같은 고급스러운 어두운 배경 */
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- 상단 네비게이션 바 (index.html과 동일 스타일 유지) --- */
        .navbar {
            background-color: #0f172a;
            padding: 25px 60px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            align-items: center;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-right {
            display: flex;
            align-items: center;
        }

        .navbar a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            margin-left: 20px; 
            font-size: 13px;
            font-weight: 700;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .navbar a:hover {
            color: #ffffff; 
        }

        #authBtn {
            color: #3b82f6;
            border: 1px solid #3b82f6;
            padding: 5px 12px;
            border-radius: 4px;
            margin-left: 0;
        }

        /* --- 로그인 / 회원가입 인증 카드 섹션 --- */
        .auth-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-card {
            background-color: #1e293b; /* 딥 네이비 카드 바디 */
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 50px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .auth-card h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .auth-card p {
            color: #94a3b8;
            font-size: 14px;
            font-style: italic;
            margin-bottom: 35px;
        }

        /* 입력 폼 스타일 */
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .input-group input {
            width: 100%;
            box-sizing: border-box;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 12px 16px;
            color: white;
            font-family: inherit;
            font-size: 14px;
            transition: 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        /* 버튼 스타일 */
        .submit-btn {
            width: 100%;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #2563eb;
        }

        /* 하단 토글 링크 */
        .switch-mode {
            margin-top: 25px;
            font-size: 13px;
            color: #94a3b8;
        }

        .switch-mode a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 700;
            margin-left: 5px;
        }

        .switch-mode a:hover {
            text-decoration: underline;
        }

        /* --- 반응형 디자인 --- */
        @media (max-width: 900px) {
            .navbar {
                justify-content: center;
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }
            .nav-left, .nav-right {
                justify-content: center;
                width: 100%;
            }
            .navbar a {
                margin: 5px 10px;
                font-size: 11px;
            }
            .auth-card {
                padding: 40px 25px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="login.html" id="authBtn">Login</a>
        </div>
        <div class="nav-right">
            <a href="index.html">Home</a>
            <a href="brain.html">Brain Map</a>
            <a href="archive.html">Brain Archive</a> 
            <a href="disease.html">Disorder</a>
            <a href="bbb.html">BBB</a>
            <a href="treatment.html">Treatment</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2 id="formTitle">Sign In</h2>
            <p id="formSubTitle">Access the NeuroInsight research platform</p>

            <form id="authForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="researcher@university.edu" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
            </form>

            <div class="switch-mode">
                <span id="switchText">New to NeuroInsight?</span>
                <a href="#" id="switchBtn">Create an account</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

        // 본인의 Firebase Config 정보를 입력하세요 (기존 정보 동일 적용 가능)
        const firebaseConfig = {
            apiKey: "AIzaSyA8UUSVJ9gX0JdC04ke6FpEV5yix9FR3Is",
            authDomain: "neuroinsight-9a401.firebaseapp.com",
            projectId: "neuroinsight-9a401",
            storageBucket: "neuroinsight-9a401.firebasestorage.app",
            messagingSenderId: "273812619662",
            appId: "1:273812619662:web:1427bcc820350c97ca24df",
            measurementId: "G-L8F2G12TM9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isSignUpMode = false; // 기본 모드는 로그인(Sign In)

        const formTitle = document.getElementById('formTitle');
        const formSubTitle = document.getElementById('formSubTitle');
        const submitBtn = document.getElementById('submitBtn');
        const switchText = document.getElementById('switchText');
        const switchBtn = document.getElementById('switchBtn');
        const authForm = document.getElementById('authForm');

        // 로그인 <-> 회원가입 모드 전환 기능
        switchBtn.addEventListener('click', (e) => {
            e.preventDefault();
            isSignUpMode = !isSignUpMode;

            if (isSignUpMode) {
                formTitle.textContent = "Create Account";
                formSubTitle.textContent = "Join the advanced therapeutics study";
                submitBtn.textContent = "Sign Up";
                switchText.textContent = "Already have an account?";
                switchBtn.textContent = "Sign In";
            } else {
                formTitle.textContent = "Sign In";
                formSubTitle.textContent = "Access the NeuroInsight research platform";
                submitBtn.textContent = "Sign In";
                switchText.textContent = "New to NeuroInsight?";
                switchBtn.textContent = "Create an account";
            }
            authForm.reset();
        });

        // 폼 제출 이벤트 처리 (Firebase Auth 연결)
        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isSignUpMode) {
                // 회원가입 프로세스
                createUserWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        alert("회원가입이 완료되었습니다! 자동으로 로그인됩니다.");
                        window.location.href = "index.html";
                    })
                    .catch((error) => {
                        alert("회원가입 실패: " + error.message);
                    });
            } else {
                // 로그인 프로세스
                signInWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        alert("성공적으로 로그인되었습니다.");
                        window.location.href = "index.html";
                    })
                    .catch((error) => {
                        alert("로그인 실패: 이메일 또는 비밀번호를 확인하세요.");
                    });
            }
        });
    </script>
</body>
</html>
