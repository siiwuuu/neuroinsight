<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

    const firebaseConfig = { /* 사용자님의 Config 입력 */ };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // 로그인 상태 감시카메라
    onAuthStateChanged(auth, (user) => {
        const nav = document.querySelector('.navbar');
        // 기존의 Login 버튼 찾기 (클래스명이 login-btn이라고 가정)
        const loginBtn = document.querySelector('.login-btn') || nav.querySelector('a[href="login.html"]');

        if (user) {
            // 로그인 상태일 때: "이름(Logout)"으로 변경
            const userName = user.displayName || "User";
            loginBtn.innerHTML = `<span style="color: #60a5fa;">${userName}</span> (Logout)`;
            loginBtn.href = "#";
            loginBtn.onclick = () => {
                signOut(auth).then(() => {
                    alert("로그아웃 되었습니다.");
                    location.reload(); // 페이지 새로고침
                });
            };
        } else {
            // 로그아웃 상태일 때
            loginBtn.textContent = "Login";
            loginBtn.href = "login.html";
            loginBtn.onclick = null;
        }
    });
</script>
