<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Map - NeuroInsight</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Libre Baskerville', serif;
            margin: 0;
            background-color: #f8fafc;
            color: #1e293b;
            transition: background-color 0.3s ease;
        }

        /* 네비게이션 바 */
        .navbar {
            background-color: #0f172a;
            padding: 25px 60px;
            display: flex;
            justify-content: flex-end;
            flex-wrap: wrap; /* 메뉴가 많아질 때를 대비해 줄바꿈 허용 */
        }
        .navbar a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            margin-left: 30px; /* 메뉴가 늘어남에 따라 간격을 25px -> 20px로 소폭 조정 */
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            transition: color 0.3s ease;
        }
        .navbar a:hover {
            color: #ffffff;
        }

        /* 메인 레이아웃 */
        .main-content {
            display: flex;
            max-width: 1200px;
            margin: 60px auto;
            gap: 40px;
            padding: 0 20px;
            align-items: flex-start;
        }

        /* 왼쪽: 뇌 시각화 영역 */
        .brain-viz {
            flex: 1.2;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            text-align: center;
        }

        /* 뇌 파트 애니메이션 및 스타일 */
        .brain-part {
            fill: #e2e8f0;
            stroke: #94a3b8;
            stroke-width: 1.5;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .brain-part:hover {
            fill: #cbd5e1;
            transform: translateY(-3px);
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
        }

        .brain-part.active {
            fill: #475569;
            stroke: #0f172a;
            filter: drop-shadow(0 0 12px rgba(71, 85, 105, 0.3));
        }

        /* 오른쪽: 설명 패널 */
        .info-panel {
            flex: 0.8;
            background: #0f172a;
            color: white;
            padding: 40px;
            border-radius: 24px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
            transition: transform 0.3s ease;
        }

        .info-panel h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #94a3b8;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .info-panel p {
            font-size: 18px;
            line-height: 1.8;
            color: #cbd5e1;
        }

        .instruction {
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
            font-style: italic;
        }

        /* 반응형 디자인 (아이패드 및 모바일 대응) */
        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
                margin: 30px auto;
            }
            .navbar {
                padding: 20px;
                justify-content: center;
            }
            .navbar a {
                margin: 5px 20px;
                font-size: 11px;
            }
            .brain-viz, .info-panel {
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="index.html">Home</a>
    <a href="brain.html">Brain Map</a>
    <a href="archive.html">Brain Archive</a>
    <a href="disease.html">Disorder</a>
    <a href="bbb.html">BBB</a>
    <a href="treatment.html">Treatment</a>
    <a href="login.html" style="color: #3b82f6;">Login</a> 
    </nav>

    <div class="main-content">
        <div class="brain-viz">
            <h3 style="margin-bottom: 30px; color: #0f172a;">Interactive Neuroanatomy</h3>
            
            <svg viewBox="0 0 400 300" width="100%" id="brain-svg">
                <path class="brain-part" id="frontal" d="M100,100 C100,50 200,40 300,100 L300,160 L100,160 Z" onclick="showInfo('Frontal Lobe')" />
                <path class="brain-part" id="parietal" d="M305,100 C350,100 380,130 380,180 L305,180 Z" onclick="showInfo('Parietal Lobe')" />
                <path class="brain-part" id="temporal" d="M120,170 L280,170 L280,230 C200,260 120,260 120,230 Z" onclick="showInfo('Temporal Lobe')" />
                <path class="brain-part" id="occipital" d="M305,185 L380,185 L350,250 C320,250 305,230 305,185 Z" onclick="showInfo('Occipital Lobe')" />
                <path class="brain-part" id="cerebellum" d="M280,240 C320,240 350,260 340,285 C300,295 270,280 270,260 Z" onclick="showInfo('Cerebellum')" />
            </svg>
            
            <p class="instruction">각 뇌 영역을 클릭하여 세부 기능을 확인하세요.</p>
        </div>

        <div class="info-panel" id="info-panel">
            <h2 id="region-name">Select a Region</h2>
            <p id="region-desc">뇌 지도의 특정 부위를 선택하면 해당 영역의 기능과 특성에 대한 학술적 설명이 여기에 표시됩니다.</p>
        </div>
    </div>

    <script>
        const brainData = {
            'Frontal Lobe': '전두엽(Frontal Lobe)은 대뇌 반구의 앞부분에 위치하며, 실행 기능, 계획, 의사결정, 그리고 수의적 운동 조절을 담당하는 고위 인지 기능의 중추입니다.',
            'Parietal Lobe': '두정엽(Parietal Lobe)은 신체 각 부위로부터 들어오는 감각 정보를 통합하며, 공간 인지, 물체 식별 및 수리적 사고에 핵심적인 역할을 수행합니다.',
            'Temporal Lobe': '측두엽(Temporal Lobe)은 청각 정보 처리를 주된 기능으로 하며, 언어의 이해(베르니케 영역)와 장기 기억의 형성 및 저장에 관여합니다.',
            'Occipital Lobe': '후두엽(Occipital Lobe)은 뇌의 후방에 위치하며 일차 시각 피질이 집중되어 있어, 망막으로부터 오는 시각 신호를 해석하고 이미지를 인식합니다.',
            'Cerebellum': '소뇌(Cerebellum)는 "작은 뇌"라고도 불리며, 정밀한 근육 운동의 조절, 평형 감각 유지 및 운동 학습에 필수적인 역할을 담당합니다.'
        };

        function showInfo(name) {
            const nameEl = document.getElementById('region-name');
            const descEl = document.getElementById('region-desc');

            // 텍스트 업데이트
            nameEl.innerText = name;
            descEl.innerText = brainData[name];

            // 모든 파트에서 active 클래스 제거
            document.querySelectorAll('.brain-part').forEach(part => {
                part.classList.remove('active');
            });

            // 클릭된 요소에 active 클래스 추가
            if (event && event.target) {
                event.target.classList.add('active');
            }
        }
    </script>
</body>
</html>
