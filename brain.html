<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Brain Map - NeuroInsight</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Libre Baskerville', serif;
            margin: 0;
            background-color: #f8fafc;
            color: #1e293b;
        }

        /* 메인 페이지와 동일한 네비바 */
        .navbar {
            background-color: #0f172a;
            padding: 25px 60px;
            display: flex;
            justify-content: flex-end;
        }
        .navbar a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            margin-left: 35px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .main-content {
            display: flex;
            max-width: 1200px;
            margin: 60px auto;
            gap: 40px;
            padding: 0 20px;
            align-items: flex-start;
        }

        /* 왼쪽: 뇌 시각화 영역 */
        .brain-viz {
            flex: 1.2;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            text-align: center;
        }

        /* 뇌 파트 스타일 */
        .brain-part {
            fill: #e2e8f0;
            stroke: #94a3b8;
            stroke-width: 1.5;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .brain-part:hover {
            fill: #94a3b8;
            filter: brightness(0.9);
        }

        .brain-part.active {
            fill: #475569; /* 선택된 영역 색상 */
            stroke: #0f172a;
        }

        /* 오른쪽: 설명 패널 */
        .info-panel {
            flex: 0.8;
            background: #0f172a;
            color: white;
            padding: 40px;
            border-radius: 24px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
        }

        .info-panel h2 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #94a3b8;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .info-panel p {
            font-size: 18px;
            line-height: 1.8;
            color: #cbd5e1;
        }

        .instruction {
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
            font-style: italic;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="brain.html">Brain Map</a>
        <a href="disease.html">Disorder</a>
        <a href="bbb.html">BBB</a>
        <a href="treatment.html">Treatment</a>
    </nav>

    <div class="main-content">
        <div class="brain-viz">
            <h3 style="margin-bottom: 30px; color: #0f172a;">Interactive Neuroanatomy</h3>
            
            <svg viewBox="0 0 400 300" width="100%" id="brain-svg">
                <path class="brain-part" id="frontal" d="M100,100 C100,50 200,40 300,100 L300,160 L100,160 Z" onclick="showInfo('Frontal Lobe')" />
                <path class="brain-part" id="parietal" d="M305,100 C350,100 380,130 380,180 L305,180 Z" onclick="showInfo('Parietal Lobe')" />
                <path class="brain-part" id="temporal" d="M120,170 L280,170 L280,230 C200,260 120,260 120,230 Z" onclick="showInfo('Temporal Lobe')" />
                <path class="brain-part" id="occipital" d="M305,185 L380,185 L350,250 C320,250 305,230 305,185 Z" onclick="showInfo('Occipital Lobe')" />
            </svg>
            
            <p class="instruction">각 뇌 영역을 클릭하여 세부 기능을 확인하세요.</p>
        </div>

        <div class="info-panel" id="info-panel">
            <h2 id="region-name">Select a Region</h2>
            <p id="region-desc">뇌 지도의 특정 부위를 선택하면 해당 영역의 기능과 특성에 대한 학술적 설명이 여기에 표시됩니다.</p>
        </div>
    </div>

    <script>
        const brainData = {
            'Frontal Lobe': '전두엽은 대뇌 반구의 앞부분에 위치하며, 실행 기능, 계획, 추론, 그리고 수의적 운동 조절을 담당하는 고위 인지 기능의 중추입니다.',
            'Parietal Lobe': '두정엽은 신체 각 부위로부터 들어오는 감각 정보를 통합하며, 공간 인지 및 수리적 사고에 핵심적인 역할을 수행합니다.',
            'Temporal Lobe': '측두엽은 청각 정보 처리를 담당하며, 언어의 이해(베르니케 영역)와 장기 기억의 형성 및 회복에 관여합니다.',
            'Occipital Lobe': '후두엽은 뇌의 뒷부분에 위치하며 시각 피질이 집중되어 있어, 시각 정보를 수용하고 해석하는 기능을 전담합니다.'
        };

        function showInfo(name) {
            // 정보 업데이트
            document.getElementById('region-name').innerText = name;
            document.getElementById('region-desc').innerText = brainData[name];

            // 모든 파트에서 active 제거 및 현재 클릭한 것만 추가
            document.querySelectorAll('.brain-part').forEach(part => {
                part.classList.remove('active');
            });
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
