<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detailed Brain Map - NeuroInsight</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Libre Baskerville', serif; margin: 0; background-color: #f8fafc; color: #1e293b; }

        /* 네비게이션 바 (로그인 버튼 왼쪽 배치 버전) */
        .navbar { background-color: #000b1a; padding: 25px 60px; display: flex; justify-content: flex-end; align-items: center; }
        .navbar a { color: rgba(255, 255, 255, 0.7); text-decoration: none; margin-left: 30px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; transition: 0.3s; }
        .navbar a:hover { color: #fff; }
        .login-btn { margin-left: 0 !important; margin-right: auto; color: #94a3b8 !important; border: 1px solid rgba(148, 163, 184, 0.3); padding: 6px 15px; border-radius: 6px; font-size: 12px !important; }

        .main-content { display: flex; max-width: 1200px; margin: 60px auto; gap: 40px; padding: 0 20px; align-items: stretch; }

        /* 뇌 시각화 영역 */
        .brain-viz { flex: 1.2; background: white; padding: 50px; border-radius: 30px; box-shadow: 0 15px 50px rgba(0,0,0,0.05); text-align: center; position: relative; }

        /* 뇌 파트 스타일 */
        .brain-part { 
            fill: #e2e8f0; 
            stroke: #94a3b8; 
            stroke-width: 0.8; 
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.2, 1, 0.3, 1);
            filter: url(#dropShadow); /* 그림자 필터 적용 */
        }
        .brain-part:hover { fill: #cbd5e1; transform: scale(1.02); }
        .brain-part.active { fill: #475569; stroke: #0f172a; }

        /* 뇌 주름(Sulci) 스타일 - 클릭 방해 안 되게 설정 */
        .sulci { fill: none; stroke: rgba(0, 0, 0, 0.15); stroke-width: 0.5; pointer-events: none; }

        /* 정보 패널 */
        .info-panel { flex: 0.8; background: #000b1a; color: white; padding: 45px; border-radius: 30px; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 25px 50px rgba(0,0,0,0.2); }
        .info-panel h2 { font-size: 34px; margin-bottom: 20px; color: #94a3b8; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
        .info-panel p { font-size: 18px; line-height: 1.8; color: #cbd5e1; }

        .instruction { margin-top: 30px; font-size: 14px; color: #94a3b8; font-style: italic; }

        @media (max-width: 900px) {
            .main-content { flex-direction: column; }
            .navbar { padding: 20px; justify-content: center; }
            .login-btn { margin-right: 15px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="login.html" class="login-btn">Login</a>
        <a href="index.html">Home</a>
        <a href="brain.html">Brain Map</a>
        <a href="archive.html">Brain Archive</a>
        <a href="disease.html">Disorder</a>
        <a href="bbb.html">BBB</a>
        <a href="treatment.html">Treatment</a>
    </nav>

    <div class="main-content">
        <div class="brain-viz">
            <h3 style="margin-bottom: 40px; color: #0f172a; letter-spacing: 1px;">Detailed Neuroanatomy</h3>
            
            <svg viewBox="0 0 400 350" width="100%" id="brain-svg">
                <defs>
                    <filter id="dropShadow" x="-20%" y="-20%" width="150%" height="150%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
                        <feOffset dx="2" dy="4" result="offsetblur" />
                        <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
                        <feMerge> <feMergeNode/> <feMergeNode in="SourceGraphic"/> </feMerge>
                    </filter>
                    <radialGradient id="partGrad" cx="50%" cy="40%" r="70%">
                        <stop offset="0%" style="stop-color:rgba(255,255,255,0.3)" />
                        <stop offset="100%" style="stop-color:rgba(0,0,0,0.05)" />
                    </radialGradient>
                </defs>

                <path class="brain-part" id="frontal" d="M110,80 C110,40 220,35 300,90 L300,170 C220,175 110,180 110,150 Z" onclick="showInfo('Frontal Lobe')" />
                <path class="brain-part" id="parietal" d="M305,90 C360,95 390,130 390,190 L305,190 Z" onclick="showInfo('Parietal Lobe')" />
                <path class="brain-part" id="temporal" d="M130,185 C130,185 285,185 285,185 C285,250 200,280 130,240 Z" onclick="showInfo('Temporal Lobe')" />
                <path class="brain-part" id="occipital" d="M305,195 L390,195 C370,260 330,260 305,195 Z" onclick="showInfo('Occipital Lobe')" />
                <path class="brain-part" id="cerebellum" d="M280,255 C330,255 360,280 340,310 C290,320 270,300 270,270 Z" onclick="showInfo('Cerebellum')" />

                <g class="sulci">
                    <path d="M150,90 Q180,120 160,150" />
                    <path d="M220,70 Q240,110 210,160" />
                    <path d="M300,90 L300,170" /> <path d="M330,120 Q360,140 340,170" />
                    <path d="M160,205 Q220,220 270,205" /> <path d="M290,265 L320,280" /> </g>
            </svg>
            
            <p class="instruction">각 영역의 주름진 표면을 클릭하여 세부 기능을 탐구하세요.</p>
        </div>

        <div class="info-panel" id="info-panel">
            <h2 id="region-name">Select a Region</h2>
            <p id="region-desc">학술적으로 정의된 각 대뇌 피질의 영역을 선택하십시오. 해당 영역의 고위 인지 기능과 신경학적 특성이 여기에 표시됩니다.</p>
        </div>
    </div>

    <script>
        const brainData = {
            'Frontal Lobe': '전두엽은 고위 인지 기능의 중추로, 의사결정, 계획 수립, 사회적 행동 억제 및 수의적 운동 조절(Primary Motor Cortex)을 담당합니다.',
            'Parietal Lobe': '두정엽은 체감각 정보를 통합하며, 공간 인지 능력과 수리적 사고, 그리고 물체 간의 거리를 파악하는 시공간적 프로세싱을 수행합니다.',
            'Temporal Lobe': '측두엽은 일차 청각 피질을 포함하며, 언어의 이해(Wernicke 영역) 및 해마와 연계된 장기 기억의 저장과 회상에 필수적입니다.',
            'Occipital Lobe': '후두엽은 망막에서 전달된 시각 신호를 처리하는 일차 시각 피질(V1)이 위치한 곳으로, 형체, 색상, 운동 상태 등의 시각 정보를 해석합니다.',
            'Cerebellum': '소뇌는 운동의 정밀도를 조절하고 평형을 유지합니다. 최근 연구에 따르면 단순 운동 제어를 넘어 인지적 유연성과 학습 능력에도 관여함이 밝혀졌습니다.'
        };

        function showInfo(name) {
            const nameEl = document.getElementById('region-name');
            const descEl = document.getElementById('region-desc');
            nameEl.innerText = name;
            descEl.innerText = brainData[name];

            document.querySelectorAll('.brain-part').forEach(part => part.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
        }
    </script>
</body>
</html>
